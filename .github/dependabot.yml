version: 2

# ENG-18. Every third-party action in this repo is pinned to a 40-hex SHA, which
# `hardening.rs` enforces — a good posture that quietly becomes a bad one with
# nobody advancing the pins. It had already happened: nine sites pinned
# `Swatinem/rust-cache` to a March 2026 master commit that is on no tag at all,
# and the pin sat there because the only thing that would have moved it was
# somebody noticing.
#
# Scope, stated honestly: the github-actions ecosystem scans `.github/workflows/`
# in this repo and nothing else. `claude-plugin/templates/code-graph-snapshot.yml`
# — a workflow SHIPPED into users' repos, holding `contents: write` — is not
# watched here; `tests/hardening.rs:2723` is what guards its pins.
#
# github-actions only. Cargo and npm updates are deliberately NOT enabled here:
# `--locked` builds and the release pipeline's version gates mean a dependency
# bump is a decision with a rebuild attached, not something to merge weekly.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    commit-message:
      prefix: chore(ci)
    groups:
      # One PR for the whole set: the drift guard requires release.yml and
      # cache-warm.yml to pin rust-cache to the SAME sha, so per-action PRs
      # would land a red intermediate state.
      actions:
        patterns:
          - "*"
    ignore:
      # `dtolnay/rust-toolchain` is pinned to a VERSION BRANCH (1.95.0), not a
      # release tag, and it selects the compiler that builds the published npm
      # binaries — release.yml documents that pin as a supply-chain control.
      # Moving it is a deliberate toolchain decision, not something to approve
      # inside a routine grouped `chore(ci)` bump.
      - dependency-name: dtolnay/rust-toolchain
